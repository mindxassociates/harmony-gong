name: Build HD portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-portrait:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portrait asset
        shell: bash
        run: |
          set -euo pipefail
          target="assets/harmony-gong-profile-hd.jpg"
          source64="assets/harmony-gong-profile-hd.jpg.base64"
          if [ -s "$target" ]; then
            echo "HD portrait already present."
            exit 0
          fi
          test -s "$source64"
          base64 --decode "$source64" > "$target"
          test -s "$target"
          file "$target" | grep -qi 'JPEG image data'
          rm "$source64"
      - name: Commit portrait
        shell: bash
        run: |
          if git status --porcelain -- assets | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A assets
            git commit -m "Add HD Harmony Gong portrait"
            git push
          fi
